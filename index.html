<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Tip Calculator</title>
    <meta name="description" content="A little less math at the table. Calculate your tip and total in a moment.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#edf4f1">
    <link rel="stylesheet" href="src/style.css?v=a9b39060c6df">
    <script src="src/jquery-3.6.0.slim.min.js" defer></script>
    <script src="src/script.js?v=8eb97208739f" defer></script>
</head>
<body>
    <main class="container">
        <header class="page-header">
            <div class="brand"><span class="brand-mark" aria-hidden="true">%</span> TIP CALCULATOR</div>
            <h1>A little less math.<br>A little more thanks.</h1>
            <p>Set your bill, choose a tip, and you're all set.</p>
        </header>
        <div class="calculator">
            <section class="controls" aria-label="Calculate your tip">
                <div class="section-heading"><span class="step" aria-hidden="true">01</span><h2>The bill</h2></div>
                <label for="billAmount">Bill amount</label>
                <div class="input bill-field">
                    <span class="input-symbol" aria-hidden="true">$</span>
                    <input id="billAmount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" class="billInput" aria-describedby="inputError">
                </div>
                <fieldset class="options">
                    <legend><span class="step" aria-hidden="true">02</span>Leave a tip</legend>
                    <p class="field-hint">Choose a percentage or enter your own.</p>
                    <div class="buttons">
                        <button type="button" class="tip-button" data-percent="0.05" aria-pressed="false" onclick="changePercent(0.05)">5%</button>
                        <button type="button" class="tip-button" data-percent="0.1" aria-pressed="false" onclick="changePercent(0.1)">10%</button>
                        <button type="button" class="tip-button" data-percent="0.15" aria-pressed="false" onclick="changePercent(0.15)">15%</button>
                        <button type="button" class="tip-button" data-percent="0.2" aria-pressed="false" onclick="changePercent(0.2)">20%</button>
                    </div>
                    <label for="customPercent">Custom percentage</label>
                    <div class="input custom-field">
                        <input id="customPercent" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Your choice" class="custom" aria-describedby="inputError">
                        <span class="input-symbol" aria-hidden="true">%</span>
                    </div>
                </fieldset>
                <p id="inputError" class="input-error" role="status"></p>
            </section>
            <section class="results" aria-labelledby="summaryHeading">
                <div class="summary-heading"><h2 id="summaryHeading">The breakdown</h2></div>
                <div class="receipt" aria-live="polite" aria-atomic="true">
                    <div class="receipt-row"><span>Bill amount</span><span class="billResult">$0.00</span></div>
                    <div class="receipt-row"><span>Tip <span class="tip-rate">(0%)</span></span><span class="result">$0.00</span></div>
                    <div class="receipt-total"><span>Total to pay</span><strong class="totalResult">$0.00</strong><span class="total-caption">Bill + tip</span></div>
                </div>
                <button type="button" class="reset" onclick="reset()"><span aria-hidden="true">↺</span> Start over</button>
            </section>
        </div>
    </main>
</body>
</html>
